<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GDR - Poteri</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>
</head>

<body>

    <header>GDR - Poteri</header>

    <!-- Main site navigation -->
    <nav class="site-nav">
        <a href="index.html" class="nav-link home-link">Home</a>
        <a href="classi.html" class="nav-link">Classi</a>
        <a href="equipaggiamento.html" class="nav-link">Equipaggiamento</a>
        <a href="razze.html" class="nav-link">Razze</a>
        <a href="talenti.html" class="nav-link">Talenti</a>
        <a href="pteri.html" class="nav-link">Poteri</a>
        <a href="utility.html" class="nav-link">Utility</a>
        <a href="condizioni.html" class="nav-link">Condizioni</a>
    </nav>

    <!-- Class-specific navigation -->
    <nav class="poteri-list">
        <a href="Poteri della Forza.html" id="poteri-della-forza" class="poteri-link">Poteri della Forza</a>
        <a href="Poteri Tecnologici.html" id="poteri-tecnologici" class="poteri-link">Poteri Tecnologici</a>
        <a href="Regole sul Lancio dei Poteri.html" class="poteri-link">Regole sul Lancio dei Poteri</a>
    </nav>

    <main>
        <div class="poteri-content">
            <p>Seleziona una classe per visualizzarne il contenuto.</p>
        </div>
    </main>

    <footer>© 2025 GDR Docs</footer>
    <a id="back-to-top" title="Torna su">↑</a>
    <a id="home-button" title="Home">🏠</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main .poteri-content');
            const header = document.querySelector('header');
            const headerOffset = header ? header.getBoundingClientRect().height + 56 : 0;

            // --- Back to top ---
            const backToTop = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 200) backToTop.classList.add('show');
                else backToTop.classList.remove('show');
            });
            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // === HOME BUTTON ===
            const homeButton = document.getElementById('home-button');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 200) homeButton.classList.add('show');
                else homeButton.classList.remove('show');
            });

            homeButton.addEventListener('click', () => {
                const isGitHub = window.location.hostname.includes('github.io');
                const repoPrefix = isGitHub ? '/' + window.location.pathname.split('/')[1] + '/' : '/';
                window.location.href = repoPrefix + 'index.html';
            });

            // --- Determine base path dynamically ---
            const isGitHub = window.location.hostname.includes('github.io');
            const repoPrefix = isGitHub ? '/' + window.location.pathname.split('/')[1] + '/' : '/';
            const classiBase = repoPrefix + 'poteri/';

            // -----------------------------
            // ⭐️ TABLE SORTING + SEARCH INIT
            // -----------------------------
            function initSortableAndSearch() {
                const tables = document.querySelectorAll('.sortable');

                tables.forEach(table => {
                    const headers = table.querySelectorAll('th');
                    headers.forEach((header, index) => {
                        header.style.cursor = 'pointer';
                        header.addEventListener('click', () => sortTableByColumn(table, index));
                    });
                });

                function sortTableByColumn(table, columnIndex) {
                    const tbody = table.tBodies[0];
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    const isNumeric = rows.every(row => !isNaN(row.cells[columnIndex].innerText.trim()));

                    const currentIsAscending = table.dataset.sortCol == columnIndex && table.dataset.sortDir === 'asc';
                    const direction = currentIsAscending ? 'desc' : 'asc';

                    rows.sort((a, b) => {
                        let aText = a.cells[columnIndex].innerText.trim();
                        let bText = b.cells[columnIndex].innerText.trim();

                        if (isNumeric) {
                            return direction === 'asc' ? aText - bText : bText - aText;
                        } else {
                            return direction === 'asc' ? aText.localeCompare(bText) : bText.localeCompare(aText);
                        }
                    });

                    rows.forEach(row => tbody.appendChild(row));

                    table.dataset.sortCol = columnIndex;
                    table.dataset.sortDir = direction;

                    table.querySelectorAll('th').forEach((th, idx) => {
                        th.classList.remove('sorted-asc', 'sorted-desc');
                        if (idx === columnIndex) {
                            th.classList.add(direction === 'asc' ? 'sorted-asc' : 'sorted-desc');
                        }
                    });
                }

                // --- Search bar with double-binding protection ---
                const searchInput = document.getElementById('table-search');
                if (searchInput && !searchInput.dataset.bound) {
                    searchInput.dataset.bound = "true";
                    searchInput.addEventListener('input', () => {
                        const filter = searchInput.value.toLowerCase();
                        tables.forEach(table => {
                            const rows = table.tBodies[0].querySelectorAll('tr');
                            rows.forEach(row => {
                                const text = row.innerText.toLowerCase();
                                row.style.display = text.includes(filter) ? '' : 'none';
                            });
                        });
                    });
                }
            }

            // --- Smooth scroll for internal links ---
            function attachInternalLinkScrolling(container) {
                container.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        const targetId = this.getAttribute('href').substring(1);
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            e.preventDefault();
                            const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
                            const offsetPosition = elementPosition - headerOffset;
                            window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                            history.pushState(null, '', `#${targetId}`);
                        }
                    });
                });
            }

            // --- Load class content dynamically ---
            document.querySelectorAll('.poteri-list .poteri-link').forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const page = this.getAttribute('href').split('/').pop();
                    const htmlPath = classiBase + this.getAttribute('href');

                    fetch(htmlPath)
                        .then(response => response.text())
                        .then(html => {
                            main.innerHTML = html;

                            // ⭐️ Initialize sorting + search after HTML is inserted
                            initSortableAndSearch();

                            attachInternalLinkScrolling(main);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            history.pushState(null, '', htmlPath);
                            showHomeButton();
                            updateActiveNav();
                            updateActiveClassLink(this);
                        })
                        .catch(err => console.error('Failed to load class content:', err));
                });
            });

            // --- Navbar links dynamically reset URL ---
            document.querySelectorAll('.site-nav .nav-link').forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    window.location.href = repoPrefix + href;
                });
            });

            function updateActiveNav() {
                const currentPath = window.location.pathname.split('/').pop();
                document.querySelectorAll('.site-nav .nav-link').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href === currentPath) link.classList.add('active');
                    else link.classList.remove('active');
                });
            }

            function updateActiveClassLink(clickedLink) {
                document.querySelectorAll('.poteri-list .poteri-link').forEach(link => {
                    link.classList.remove('active');
                });
                if (clickedLink) clickedLink.classList.add('active');
            }

            function showHomeButton() {
                document.querySelector('.site-nav .home-link').style.visibility = 'visible';
            }

            updateActiveNav();

            // --- Handle Back/Forward navigation ---
            window.addEventListener('popstate', () => {
                const path = location.pathname;
                if (path.includes('/poteri/')) {
                    fetch(path)
                        .then(r => r.text())
                        .then(html => {
                            main.innerHTML = html;
                            initSortableAndSearch(); // ⭐️ re-init here too
                            attachInternalLinkScrolling(main);
                        });
                }
                showHomeButton();
                updateActiveNav();
            });
        });
    </script>

</body>

</html>
